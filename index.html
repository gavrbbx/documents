<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Намский педагогический колледж им. И.Е. Винокурова — документы</title>
<link rel="icon" href="logo.png">
<style>
:root{--blue:#3a5a8f;--blue-dark:#26406a;--bg:#f2f5f9;--ink:#16253a;--muted:#5b6b80;--line:#d6dee9}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 "Segoe UI","Helvetica Neue",Arial,sans-serif}
.wrap{max-width:960px;margin:0 auto;padding:0 20px}
header{background:var(--blue-dark);color:#fff}
.top{display:flex;align-items:center;gap:22px;padding:26px 0}
.top img{width:92px;height:92px;flex:none}
h1{margin:0;font-size:1.55rem;line-height:1.25}
.sub{margin:6px 0 0;color:#c7d5ec}
main{padding:30px 0 50px}
.bar{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:14px;margin-bottom:18px}
.bar p{margin:0;color:var(--muted);max-width:560px}
.btn{display:inline-block;text-decoration:none;font-weight:600;padding:12px 22px;border-radius:10px;
  background:var(--blue);color:#fff}
.btn:hover{background:var(--blue-dark)}
a:focus-visible{outline:3px solid #7aa2e0;outline-offset:2px}
.box{background:#fff;border:1px solid var(--line);border-radius:12px;overflow:hidden}
iframe{display:block;width:100%;height:620px;border:0}
.notice{padding:32px 24px;color:var(--muted);text-align:center}
footer{border-top:1px solid var(--line);padding:20px 0;color:var(--muted);font-size:.9rem}
@media (max-width:560px){.top{gap:14px}.top img{width:64px;height:64px}h1{font-size:1.2rem}.btn{width:100%;text-align:center}iframe{height:520px}}
</style>
</head>
<body>
<header>
  <div class="wrap top">
    <img src="logo.png" alt="Эмблема колледжа">
    <div>
      <h1>Намский педагогический колледж<br>им. И.Е. Винокурова</h1>
      <p class="sub">Хранилище документов</p>
    </div>
  </div>
</header>

<main class="wrap">
  <div class="bar">
    <p>Здесь собраны документы колледжа. Сотрудники могут добавлять свои файлы через кнопку справа.</p>
    <a class="btn" id="upload" href="#" target="_blank" rel="noopener">Загрузить документ</a>
  </div>
  <div class="box" id="box"></div>
</main>

<footer>
  <div class="wrap">Намский педагогический колледж им. И.Е. Винокурова · <a href="mailto:info@example.org">info@example.org</a></div>
</footer>

<script>
/* ===== НАСТРОЙКА: вставьте ID папки Google Диска (см. инструкцию) ===== */
var FOLDER_ID = "1u3Jpc44Vc8fDrC29EwW9lTmUuLgSOOc0?usp=sharing";
/* ====================================================================== */
(function(){
  var box=document.getElementById('box'),up=document.getElementById('upload');
  if(!FOLDER_ID){
    box.innerHTML='<div class="notice">Хранилище ещё не подключено. Вставьте ID папки Google Диска в начало скрипта в файле index.html.</div>';
    up.style.display='none';
    return;
  }
  var f=document.createElement('iframe');
  f.src='https://drive.google.com/embeddedfolderview?id='+encodeURIComponent(FOLDER_ID)+'#list';
  f.title='Документы колледжа';
  box.appendChild(f);
  up.href='https://drive.google.com/drive/folders/'+encodeURIComponent(FOLDER_ID);
})();
</script>
</body>
</html>
